name: Release APK

# Membuat APK rilis bertanda tangan dengan nomor versi.
# - Push tag vX.Y.Z  -> build, uji, tanda tangani, lalu terbitkan GitHub Release berisi APK.
# - Run workflow (manual) dengan input versi -> build APK sebagai artifact (opsional: buat Release).
# versionName = X.Y.Z, versionCode = X*10000 + Y*100 + Z.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versi (format X.Y.Z, mis. 1.0.1)"
        required: true
      create_release:
        description: "Buat GitHub Release dengan tag vX.Y.Z"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Tentukan versi
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then RAW="$INPUT_VERSION"; else RAW="${REF_NAME#v}"; fi
          if ! [[ "$RAW" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Versi '$RAW' tidak valid. Gunakan format X.Y.Z, mis. 1.0.1"; exit 1
          fi
          MAJOR=${BASH_REMATCH[1]}; MINOR=${BASH_REMATCH[2]}; PATCH=${BASH_REMATCH[3]}
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::Minor dan patch maksimal 99 (versionCode = X*10000 + Y*100 + Z)"; exit 1
          fi
          CODE=$((10#$MAJOR * 10000 + 10#$MINOR * 100 + 10#$PATCH))
          echo "name=$RAW" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Versi $RAW (versionCode $CODE)"

      - name: Siapkan JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Pasang Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Pulihkan keystore dari secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret untuk $v belum diisi. Lihat README bagian 'Rilis otomatis (GitHub Actions)'."; exit 1
            fi
          done
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Uji, lint, dan build APK rilis
        run: >
          ./gradlew testDebugUnitTest lint assembleRelease
          -PappVersionName=${{ steps.version.outputs.name }}
          -PappVersionCode=${{ steps.version.outputs.code }}

      - name: Verifikasi tanda tangan dan beri nama
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          test -f "$SRC" || { echo "::error::APK bertanda tangan tidak ditemukan"; exit 1; }
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$SRC"
          OUT="puzzle-rosdie-v${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          ls -l "$OUT"

      - name: Hapus keystore dari runner
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - name: Unggah artifact
        uses: actions/upload-artifact@v7
        with:
          name: puzzle-rosdie-v${{ steps.version.outputs.name }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          if-no-files-found: error

      - name: Terbitkan GitHub Release
        if: github.event_name == 'push' || inputs.create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Puzzle Rosdie v${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
